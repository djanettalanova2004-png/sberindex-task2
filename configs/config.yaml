data:
  zip_url: https://www.sberbank.com/common/img/uploaded/files/pdf/sberindex/hackathonlicence.zip
  dict_url: http://www.sberbank.com/common/files/t_dict_municipal.rar
  raw_dir: data/raw
  processed_dir: data/processed

horizons: [1, 3, 6, 12]
origins:
  1: ["2023-12", "2024-03", "2024-06", "2024-09"]
  3: ["2023-12", "2024-03", "2024-06", "2024-09"]
  6: ["2023-12", "2024-03", "2024-06"]
  12: ["2023-12"]

neighbors:
  k: 8
  max_km: 150

prophet:
  n_changepoints: 1
  fourier_order: 3
  uncertainty_samples: 0
  max_workers: 8

lgbm:
  n_estimators: 250
  learning_rate: 0.05
  num_leaves: 15
  min_child_samples: 40

chronos:
  model_id: amazon/chronos-bolt-small
  batch_size: 128
  prediction_length: 12

detection:
  n_shocked: 80
  n_control: 200
  shock_size: 0.30
  shock_months: ["2024-03", "2024-04", "2024-05", "2024-06", "2024-07", "2024-08", "2024-09"]
  detect_window: 3
  target_fpr: 0.10
  eval_start: "2024-03"
  eval_end: "2024-12"
  seed: 42

outputs_dir: outputs
